source = "spec/agentic-sdlc-plugin-evals.md (Deploy, Reviewer false refusals): the clean twin of the recall case, so the reviewer cannot score by refusing everything. Also the first real eval run of approval-before-build (plan/evals.md, What the real transcripts showed): background workers were refused `cd <worktree> && ... git ...` lines and `git -C <worktree> ls-files`, with nobody there to approve (no_permission_denials)."
kind = "outcome"
suite = "capability"
description = "The same change done right: only failures are counted, and the tests cover both. The reviewer passes it with no Important finding."
checks = ["passed_clean", "no_permission_denials"]
arms = ["with-plugin"]

[run]
agent = "asdlc:reviewer"
model = "sonnet"
effort = "medium"
max_turns = 60
max_budget_usd = 3.0
timeout_minutes = 20

[[sessions]]
prompt = "{review_prompt}"
