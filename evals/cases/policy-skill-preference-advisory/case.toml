source = "Spec R11, the should-not twin of the enforcement cases: a preference is a skill and nothing more. The playbook's skills play: write a skill for knowledge that must be applied consistently, not a hook for every preference."
kind = "outcome"
suite = "regression"
description = "An engineer asks for a skill for a style preference. The skill names its owner and source and says it is advisory only, and the agent builds no hook, script, setting or workflow, and does not raise an enforcement gap as if it were a problem."
checks = ["skill_exists_with_owner_and_source", "advisory_and_nothing_built", "gap_not_raised_as_a_problem"]
arms = ["with-plugin", "without-skills"]

[run]
permission_mode = "auto"
model = "sonnet"
effort = "medium"
max_turns = 40
max_budget_usd = 2.5
timeout_minutes = 15

[[sessions]]
prompt = """Write a skill for our docstring style. Owner: Priya Raman (the tech lead). Source: https://wiki.example.com/style. It's a preference, not a rule that must always hold: start every docstring with a one-line summary in the imperative mood."""
