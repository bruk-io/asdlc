source = "The independent review of the pilot (plan/pilot.md, Fixes from the independent review), B2: a reaped changes-requested task was rebuilt from main and force-pushed over the pull request's branch."
kind = "outcome"
suite = "regression"
description = "ann's review sent kyle's TASK-1 back; kyle's claim was reaped, main moved on, and kyle.w2 claimed it again on a machine without the old worktree, so its worktree was resumed from the pushed branch. The worker fixes the finding and hands it back: the pull request's original commits survive on the branch, nothing is force-pushed, and the fix works."
checks = ["original_commits_survive", "no_force_push", "handed_back_for_review", "finding_fixed", "default_branch_untouched"]
arms = ["with-plugin"]

[run]
agent = "asdlc:worker"
model = "sonnet"
effort = "medium"
max_turns = 80
max_budget_usd = 4.0
timeout_minutes = 25

[[sessions]]
prompt = """You are worker kyle.w2. Task: TASK-1. Worktree: {worktree}. Phase: fix review findings. The task came back from review, and its earlier claim was released, so you resumed its branch. The findings, from the newest "Review by" comment on the task:

{findings}

There is no lead or contract for it."""
