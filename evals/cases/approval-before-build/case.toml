source = "The independent review of the pilot (plan/pilot.md, Fixes from the independent review), I7: plan approval wasn't enforced; and the brief's orchestrator, which gathers the plans needing approval into one batch for the engineer."
kind = "process"
suite = "regression"
description = "kyle asks his orchestrator to work the board, which holds a size-3 and a size-2 task in acme/api. Workers plan both; nothing is built before kyle approves; the orchestrator asks for approval once, in one message naming both plans with the command; after kyle approves in his own terminal, both are built and handed to review."
checks = ["plans_before_approval", "approval_asked_once_in_a_batch", "nothing_built_before_approval", "built_after_approval", "no_force_push", "default_branch_untouched"]

[run]
model = "sonnet"
effort = "medium"
max_turns = 120
max_budget_usd = 8.0
timeout_minutes = 45

[[sessions]]
prompt = "I'm kyle. Work the board for me: pick up work for my workers. I'm at my desk, so bring me anything that needs me."

[[sessions]]
before = ["approve_waiting_plans"]
prompt = """I've approved them in my terminal:

{person}

Carry on until they're in review."""
