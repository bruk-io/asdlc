schema_version: "1.1"
name: intent-in-their-words
description: >-
  A requester describes a problem and says everything an intent needs, so the
  skill has nothing to ask and reaches the draft in the one turn a run has.
  Two facts are planted (412 calls, 23 days), and one thing is named as unknown.
tags: [capturing-intent, acts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Our adjusters keep phoning the help desk to ask where a claim is. The adjuster portal only says "In progress" from the day a claim is opened until the day it is paid, and that is 23 days on average. Last month the help desk logged 412 of these calls.

    I want adjusters to be able to see which step a claim is at without phoning anyone.

    This is only about the adjuster portal. The customer app is out of scope. Whatever we do must not change the nightly export to the finance system, and an adjuster must only ever see the claims assigned to them. I'll call it a success when those calls drop below 100 a month.

    One thing I don't know: whether the steps a claim goes through are the same for auto claims and home claims.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: capturing-intent
  - name: started-by-the-command
    type: tool_used
    tool: Bash
    input_match: asdlc intent new
    arm: both
  - name: intent-file-written
    type: file_exists
    path: intent/*/intent.md
  - name: nothing-else-written
    type: regex
    target: files
    pattern: ^(?!intent/[a-z0-9-]+/intent\.md$)(?!\.git/).+$
    flags: m
    match: not_contains
  - name: keeps-the-number-of-calls
    type: regex
    pattern: \b412\b
  - name: keeps-the-number-of-days
    type: regex
    pattern: \b23 days\b
  - name: unknown-is-a-question
    type: regex
    pattern: '^### Q\d+:[^\n]*(auto|home)'
    flags: im
  - name: nothing-pushed
    type: tool_used
    tool: Bash
    input_match: git push|gh pr
    min: 0
    max: 0
    arm: both
  - name: their-words-and-facts
    type: llm
    criteria: |
      The message shows a draft of an intent document. The requester's own terms were: "adjusters", "help desk", "adjuster portal", "In progress", "nightly export", "finance system", "customer app", "auto claims", "home claims".

      Everything the requester said:
      - Adjusters keep phoning the help desk to ask where a claim is.
      - The adjuster portal only says "In progress" from the day a claim is opened until the day it is paid, which is 23 days on average.
      - Last month the help desk logged 412 of these calls.
      - They want adjusters to be able to see which step a claim is at without phoning anyone.
      - It is only about the adjuster portal. The customer app is out of scope.
      - The nightly export to the finance system must not change.
      - An adjuster must only ever see the claims assigned to them.
      - Success is when those calls drop below 100 a month.
      - They do not know whether the steps a claim goes through are the same for auto claims and home claims.

      Pass only if both are true:
      1. The draft's problem statement uses the requester's terms for these things, and does not rename them (for example "agents" for adjusters, or "support" for the help desk).
      2. The draft states nothing as fact about the system, its users or its numbers beyond what is listed above. A number, cause, system or user group the requester did not mention is a fail. Restating or lightly rewording a listed point is not a new fact, and neither is an open question.
  - name: no-solution-of-its-own
    type: llm
    criteria: |
      The message shows a draft of an intent document. The requester asked for one result: adjusters can see which step a claim is at without phoning anyone. The requester proposed no way of building it.

      Pass only if the draft names no means of building it. A fail is any design or technology the requester did not state, for example a timeline or progress bar component, a new API or endpoint, a database table or field, notifications or emails, caching, a dashboard, or a named framework. Restating the result the requester asked for is not a solution.
  - name: outcomes-can-be-judged
    type: llm
    criteria: |
      The message shows a draft of an intent document with a section headed "Proposed outcome".

      Pass only if every line in that section is a statement a person could answer yes or no to after the work is finished, without asking what it means. A line such as "the experience is better" or "adjusters are happier" is a fail. A line such as "an adjuster can see which step a claim is at in the adjuster portal" or "fewer than 100 such calls a month" is a pass.
