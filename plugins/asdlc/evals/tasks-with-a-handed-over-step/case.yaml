schema_version: "1.1"
name: tasks-with-a-handed-over-step
description: >-
  An intent, its spec and its plan of two steps are on main. Step 2 says
  "- intent: lead-access" and still says it waits on C1, and that child intent is
  on main with this one as its parent. The skill cuts step 1's task and nothing
  for step 2. This is the case that shows the child-intent route comes to an end.
tags: [generating-tasks, acts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps plan is merged. Please cut its tasks.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: generating-tasks
  - name: branch-made-by-the-command
    type: tool_used
    tool: Bash
    input_match: asdlc branch new tasks/claim-steps
    arm: both
  # "The rest of this command" is spelled out as tasks-from-an-accepted-plan has
  # it, with the reason there: the harness matches the tool's input as JSON.
  - name: step-1-has-a-task-with-a-size-on-the-scale
    type: tool_used
    tool: Bash
    input_match: 'asdlc task new(?=(?:\\\\\\n|\\[^n]|[^"\\\n;&|])*--step[ =](?:\\")?1\b)(?=(?:\\\\\\n|\\[^n]|[^"\\\n;&|])*--size[ =](?:\\")?(?:1|2|3|5|8)\b)'
    arm: both
  - name: no-task-for-the-handed-over-step
    type: tool_used
    tool: Bash
    input_match: 'asdlc task new(?:\\\\\\n|\\[^n]|[^"\\\n;&|])*--step[ =](?:\\")?2\b'
    min: 0
    max: 0
    arm: both
  - name: one-task-file
    type: regex
    target: files
    pattern: '^intent/claim-steps/tasks/[^/\n]+/task\.md$'
    flags: m
  - name: no-second-task-file
    type: regex
    target: files
    pattern: '(?:^intent/claim-steps/tasks/[^/\n]+/task\.md$[\s\S]*?){2}'
    flags: m
    match: not_contains
  - name: nothing-else-written
    type: regex
    target: files
    pattern: ^(?!intent/claim-steps/tasks/[^/\n]+/task\.md$)(?!\.git/)(?!(.*/)?__pycache__/).+$
    flags: m
    match: not_contains
  - name: answer-names-the-child-intent
    type: regex
    pattern: lead-access
  - name: nothing-pushed
    type: tool_used
    tool: Bash
    input_match: git push|gh pr
    min: 0
    max: 0
    arm: both
