schema_version: "1.1"
name: plan-waits-for-the-merge
description: >-
  The spec is written but not merged. The skill must stay out: no plan, no plan
  branch made by hand, no merge of its own, and an answer that says which merge
  the plan waits for.
tags: [generating-a-plan, stays-out]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps spec is written. Please write its plan now.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: no-plan-file
    type: file_exists
    path: intent/claim-steps/plan.md
    exists: false
  - name: no-plan-anywhere
    type: regex
    target: files
    pattern: plan
    flags: i
    match: not_contains
  - name: no-plan-branch-by-hand
    type: tool_used
    tool: Bash
    input_match: git (switch|checkout|branch)[^\n;&|]*plan/
    min: 0
    max: 0
    arm: both
  - name: did-not-merge-the-spec-itself
    type: tool_used
    tool: Bash
    input_match: git merge\s|gh pr merge
    min: 0
    max: 0
    arm: both
  - name: says-it-waits-for-the-merge
    type: regex
    pattern: merge
    flags: i
