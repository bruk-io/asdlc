schema_version: "1.1"
name: tasks-wait-for-the-merge
description: >-
  The plan is written but not merged. The skill must stay out: no task, no tasks
  branch made by hand, no merge of its own, and an answer that says which merge
  the tasks wait for.
tags: [generating-tasks, stays-out]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps plan is written. Please cut its tasks now.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: no-task-file
    type: file_exists
    path: intent/claim-steps/tasks/*/task.md
    exists: false
  - name: nothing-under-a-tasks-folder
    type: regex
    target: files
    pattern: tasks/
    match: not_contains
  - name: no-tasks-branch-by-hand
    type: tool_used
    tool: Bash
    input_match: 'git (switch|checkout|branch)(?:\\\\\\n|\\[^n]|[^"\\\n;&|])*tasks/'
    min: 0
    max: 0
    arm: both
  - name: did-not-merge-the-plan-itself
    type: tool_used
    tool: Bash
    input_match: git merge\s|gh pr merge
    min: 0
    max: 0
    arm: both
  - name: says-it-waits-for-the-merge
    type: regex
    pattern: merge
    flags: i
