schema_version: "1.1"
name: spec-waits-for-the-merge
description: >-
  The intent is written but not merged. The skill must stay out: no spec, no
  spec branch made by hand, no merge of its own, and an answer that says which
  merge the spec waits for.
tags: [generating-a-spec, stays-out]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps intent is written. Please write its spec now.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: no-spec-file
    type: file_exists
    path: intent/claim-steps/spec.md
    exists: false
  - name: no-spec-anywhere
    type: regex
    target: files
    pattern: spec
    flags: i
    match: not_contains
  - name: no-spec-branch-by-hand
    type: tool_used
    tool: Bash
    input_match: git (switch|checkout|branch)[^\n;&|]*spec/
    min: 0
    max: 0
    arm: both
  - name: did-not-merge-the-intent-itself
    type: tool_used
    tool: Bash
    input_match: git merge\s|gh pr merge
    min: 0
    max: 0
    arm: both
  - name: says-it-waits-for-the-merge
    type: regex
    pattern: merge
    flags: i
