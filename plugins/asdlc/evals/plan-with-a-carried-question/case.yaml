schema_version: "1.1"
name: plan-with-a-carried-question
description: >-
  The spec carried one question to C1, and its R2 cannot be built until that is
  answered. The plan has to keep the step, say what it waits on, and decide
  nothing.
tags: [generating-a-plan, acts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps spec is merged. Please write its plan.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: generating-a-plan
  - name: plan-file-written
    type: file_exists
    path: intent/claim-steps/plan.md
  - name: delivers-r1
    type: regex
    target:
      source: file
      path: intent/claim-steps/plan.md
    pattern: '^- delivers:[^\n]*\bR1\b'
    flags: m
  - name: delivers-r2
    type: regex
    target:
      source: file
      path: intent/claim-steps/plan.md
    pattern: '^- delivers:[^\n]*\bR2\b'
    flags: m
  - name: risks-name-the-concern
    type: regex
    target:
      source: file
      path: intent/claim-steps/plan.md
    pattern: '^## Risks(?:(?!\n## )[\s\S])*\bC1\b'
    flags: m
  - name: the-waiting-step-names-the-concern
    type: regex
    target:
      source: file
      path: intent/claim-steps/plan.md
    pattern: '^### Step \d+:[^\n]*\n+- delivers:[^\n]*\bR2\b(?:(?!\n### |\n## )[\s\S])*\bC1\b'
    flags: m
  - name: nothing-pushed
    type: tool_used
    tool: Bash
    input_match: git push|gh pr
    min: 0
    max: 0
    arm: both
  - name: does-not-decide-the-question
    type: llm
    focus:
      source: file
      path: intent/claim-steps/plan.md
    criteria: |
      This is a plan written from a spec that left one question open, as its area of concern C1: whether loss adjusters from outside the company, who have no portal account, get to see a claim's step. The claims team has not decided.

      Pass if the plan leaves that question open: it says the step that delivers R2 waits on C1 or on that decision, and it does not plan work that only makes sense under one answer.

      Fail if the plan decides it either way, for example by planning accounts or access for outside loss adjusters, or by stating that only the assigned adjuster will see the step as though that were settled.
