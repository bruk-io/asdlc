schema_version: "1.1"
name: spec-from-an-accepted-intent
description: >-
  An intent is on main with two constraints and two questions. The code answers
  the first question and nothing answers the second. Graders open the spec by its
  path and read the file.
tags: [generating-a-spec, acts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    The claim-steps intent is merged. Please write its spec.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: generating-a-spec
  - name: started-by-the-command
    type: tool_used
    tool: Bash
    input_match: asdlc spec new
    arm: both
  - name: spec-file-written
    type: file_exists
    path: intent/claim-steps/spec.md
  - name: nothing-else-written
    type: regex
    target: files
    pattern: ^(?!intent/claim-steps/spec\.md$)(?!\.git/)(?!(.*/)?__pycache__/).+$
    flags: m
    match: not_contains
  - name: row-for-the-export-constraint
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: ^\|\s*The nightly export to the finance system does not change\.?\s*\|\s*\S
    flags: im
  - name: row-for-the-assigned-claims-constraint
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: ^\|\s*An adjuster sees only the claims assigned to them\.?\s*\|\s*\S
    flags: im
  - name: first-question-answered
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: '^### Q1:[^\n]*\n+- answer: answered\s*$'
    flags: m
  - name: answer-is-the-codes-steps
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: 'received[\s\S]{0,120}assessed[\s\S]{0,120}approved[\s\S]{0,120}paid'
    flags: i
  - name: second-question-carried
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: '^### Q2:[^\n]*\n+- answer: carried\s*$'
    flags: m
  - name: has-a-concern
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: '^### C\d+: \S'
    flags: m
  - name: every-concern-has-an-owner
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: '^### C\d+:[^\n]*\n+(?!- owner: \S)'
    flags: m
    match: not_contains
  - name: design-names-the-module
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: claims_gateway
  - name: no-placeholder-left
    type: regex
    target:
      source: file
      path: intent/claim-steps/spec.md
    pattern: '<(one thing that must|Detail, when|How the requirements|a constraint, copied|the requirement or decision|the question, copied|answered or carried|The answer, or|something that could|who decides)'
    match: not_contains
  - name: nothing-pushed
    type: tool_used
    tool: Bash
    input_match: git push|gh pr
    min: 0
    max: 0
    arm: both
  - name: requirements-can-be-checked
    type: llm
    focus:
      source: file
      path: intent/claim-steps/spec.md
    criteria: |
      This is a spec document. Its requirements are the headings that start "### R" followed by a number.

      Pass only if every requirement heading, read with the lines directly under it, states one thing a person could answer yes or no to once the work is built, without asking what it means. "The adjuster portal shows the step a claim is at" passes. "The portal is easier to use" fails, and so does a heading that packs several unrelated things into one requirement.
