schema_version: "1.1"
name: small-request-no-intent
description: >-
  A one-line fix. The skill must stay out: the fix is made and no intent is
  started.
tags: [capturing-intent, stays-out]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    There's a typo in README.md: "ajdusters" should be "adjusters". Can you fix it?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
runs: 3
graders:
  - name: typo-fixed
    type: regex
    target:
      source: file
      path: README.md
    pattern: The portal adjusters use
  - name: typo-gone
    type: regex
    target:
      source: file
      path: README.md
    pattern: ajdusters
    match: not_contains
  - name: no-intent-file
    type: file_exists
    path: intent/*/intent.md
    exists: false
  - name: nothing-under-intent
    type: regex
    target: files
    pattern: ^intent/
    flags: m
    match: not_contains
  - name: no-intent-started
    type: tool_used
    tool: Bash
    input_match: asdlc intent new
    min: 0
    max: 0
    arm: both
