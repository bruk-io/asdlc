name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned so a move of ubuntu-latest can't change the environment under the checks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # The shared-board tests drive the real backlog CLI and fail, never skip, in CI
      # without it. Pinned: asdlc needs 1.55.1 or later (scripts/asdlc, MIN_BACKLOG).
      - name: Backlog.md
        run: npm install --global backlog.md@1.55.2

      - name: Artefact checks and tests
        run: ./scripts/check

      - name: Plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .
